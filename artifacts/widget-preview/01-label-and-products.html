<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meridian chat preview</title>
  <style>
    body { margin: 0; padding: 24px 16px 64px; background: #f4f6f8; color: #1d2127;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
    h1 { margin: 0; font-size: 24px; }
    h2 { margin: 0 0 8px; font-size: 15px; font-family: ui-monospace, Consolas, monospace; color: #5b6470; }
    #status { font-weight: 600; }
  </style>
</head>
<body>
  <main id="examples">
    <header>
      <h1>Meridian chat preview</h1>
      <p>Every example reply in <code>contracts/examples/</code>, drawn by the widget with no assistant running.
        Serve the repo root with <code>python -m http.server</code> and open <code>/widget/preview.html</code>.</p>
      <p id="status" role="status">Drew 2 of 2 examples.</p>
    </header>
  <section><h2>label_sections</h2><meridian-chat inline=""></meridian-chat></section><section><h2>product_list</h2><meridian-chat inline=""></meridian-chat></section></main>
  <script src="meridian-chat.js"></script>
  <script>
    const REPLIES = [
      "label_sections", "comparison", "product_list", "availability", "store_info", "policy",
      "order_status", "order_form", "order_not_verified", "emergency", "medical_advice",
      "dosing_beyond_label", "prescription", "prompt_injection", "fallback", "off_topic",
      "not_found", "lookup_failed",
    ];
    const HANDOFF = ["created", "failed"];
    const main = document.getElementById("examples");
    // ?only=emergency,fallback draws just those examples; handoff examples are "created" and "failed".
    const only = new URLSearchParams(location.search).get("only");
    const wanted = (name) => !only || only.split(",").includes(name);

    function chatFor(name) {
      const section = document.createElement("section");
      const title = document.createElement("h2");
      title.textContent = name;
      const chat = document.createElement("meridian-chat");
      chat.setAttribute("inline", "");
      section.append(title, chat);
      main.append(section);
      return chat;
    }

    async function load(path) {
      const response = await fetch(path);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    (async () => {
      const failed = [];
      let drawn = 0;
      for (const name of REPLIES.filter(wanted)) {
        try { chatFor(name).showReply(await load(`../contracts/examples/replies/${name}.json`)); drawn += 1; }
        catch (error) { failed.push(`${name} (${error.message})`); }
      }
      for (const name of HANDOFF.filter(wanted)) {
        try { chatFor(`handoff: ${name}`).showHandoff(await load(`../contracts/examples/handoff/${name}.json`)); drawn += 1; }
        catch (error) { failed.push(`handoff ${name} (${error.message})`); }
      }
      const total = REPLIES.filter(wanted).length + HANDOFF.filter(wanted).length;
      document.getElementById("status").textContent =
        `Drew ${drawn} of ${total} examples.` + (failed.length ? ` Failed: ${failed.join(", ")}.` : "");
    })();
  </script>


</body></html>
