[project]
name = "meridianpharmacyassistant"
version = "0.1.0"
description = "Customer-support assistant for a fictional pharmacy storefront: an assistant service, a mock API, catalog search and a chat widget."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "openai>=3.51.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests mirror the tree, so two test files can share a name (tests/api/test_app.py and
# tests/assistant/test_app.py). importlib mode imports each under its full path.
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
